<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vértice — AR preview</title>
<meta name="robots" content="noindex">
<style>
  /* The dark background goes on <html>, NOT <body>. mind-ar appends the camera <video> as an
     absolutely-positioned child of the container at z-index:-2, and in the root stacking context
     paint order runs: html's background, then negative-z-index children, then the background of
     in-flow blocks like <body>. A background on body therefore paints straight OVER the video.
     (It used to survive only because the old wrapper div was position:fixed, which creates its
     own stacking context and happened to shield it.) body stays transparent. */
  html { margin:0; height:100%; overflow:hidden; background:#0C0D11; }
  body { margin:0; width:100%; height:100%; overflow:hidden; background:transparent;
    color:#F6F6F8; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
  #msg { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    padding:28px; text-align:center; z-index:9999; background:#0C0D11; }
  #msg div { max-width:30rem; }
  h1 { font-size:1.05rem; font-weight:600; margin-bottom:10px; }
  p { font-size:.9rem; line-height:1.65; color:#AEB4BF; }
  code { color:#E0A24C; font-family:ui-monospace,monospace; font-size:.85em; }
  .hide { display:none !important; }
  #build { position:fixed; left:8px; bottom:6px; z-index:10000; font-size:10px;
    color:#AEB4BF; opacity:.55; pointer-events:none; font-family:ui-monospace,monospace; }
  /* No sizing rules for the scene here, deliberately. mind-ar owns that geometry: it cover-fits
     the video to the container and copies the same pixel size and negative offsets onto the
     <a-scene>, which is what keeps the 3D registered to the camera image. Forcing width/height
     overrode the sizes, left the offsets, and the result was a shifted, non-filling camera.
     The scene is appended straight to <body> so the container mind-ar measures
     (sceneEl.parentNode) is the full-viewport body — the arrangement upstream's own examples use. */
</style>
</head>
<body>
<div id="build"></div>
<div id="msg"><div><h1 id="t">Starting…</h1><p id="p">Asking for the camera.</p></div></div>
<script>
const BUILD = "2026-10-20m";
const t = document.getElementById("t"), p = document.getElementById("p"), msg = document.getElementById("msg");
const fail = (title, detail) => { t.textContent = title; p.innerHTML = detail; };

// A white or black screen with no explanation is useless, so every failure mode says what happened.
(async function () {
  let cfg;
  try { cfg = JSON.parse(sessionStorage.getItem("vertice_ar_preview") || "null"); } catch (e) {}
  if (!cfg) return fail("Nothing to preview",
    "Open this from the studio — it reads the model and target from the tab that launched it.");

  if (!window.isSecureContext) return fail("Not a secure context",
    "Cameras need HTTPS. Open this over <code>https://</code>.");
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia)
    return fail("No camera API", "This browser does not expose <code>getUserMedia</code>.");

  // Ask explicitly first: this surfaces the real reason rather than letting the AR library fail mute.
  try {
    const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: cfg.mode === "face" ? "user" : "environment" } });
    s.getTracks().forEach((x) => x.stop());          // release it; the library opens its own
  } catch (err) {
    const n = err && err.name;
    if (n === "NotAllowedError") return fail("Camera permission denied",
      "Allow camera access for this site, then reload. On iOS: Settings › Safari › Camera, or the ‘aA’ menu › Website Settings.");
    if (n === "NotFoundError" || n === "OverconstrainedError") return fail("No usable camera",
      "No camera matched the request. On a laptop the face mode wants the front camera.");
    if (n === "NotReadableError") return fail("Camera already in use",
      "Another tab or app holds the camera. Close it and reload.");
    return fail("Camera failed", "<code>" + (n || "unknown") + "</code> — " + ((err && err.message) || ""));
  }

  // Load A-Frame, then the matching MindAR runtime, in order.
  const load = (src) => new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = src; s.onload = res; s.onerror = () => rej(new Error(src));
    document.head.appendChild(s);
  });
  // The studio hands us the exact URLs it baked into the export, so the preview can never run a
  // different library version than the generated page does.
  if (!Array.isArray(cfg.libs) || !cfg.libs.length) return fail("Nothing to load",
    "The studio did not say which libraries to use. Reload the studio and press preview again.");
  try {
    for (const u of cfg.libs) await load(u);
    // Our own morph-driving component, same directory. Cache-busted with the studio build so the
    // preview can never run a stale copy of it either.
    if (cfg.mode === "face") await load("face-morphs.js?v=" + encodeURIComponent(cfg.build || ""));
  } catch (err) {
    return fail("A library did not load", "Blocked or offline: <code>" + err.message + "</code>");
  }

  // Resolve every blob: URL before building the scene. Direct fetch first; if the browser
  // refuses a cross-tab blob (iOS does this), ask the studio tab for the bytes and re-mint
  // the URL locally. Either way we know the asset is reachable before A-Frame sees it.
  const blobs = Array.from(new Set(cfg.scene.match(/blob:[^"'\s)]+/g) || []));
  if (blobs.length) {
    t.textContent = "Loading the model…";
    p.textContent = blobs.length === 1 ? "Fetching 1 asset." : "Fetching " + blobs.length + " assets.";
    const ask = (u) => new Promise((res) => {
      if (!window.opener) return res(null);
      const to = setTimeout(() => { window.removeEventListener("message", on); res(null); }, 15000);
      function on(ev) {
        if (ev.origin !== location.origin) return;
        const d = ev.data;
        if (!d || d.type !== "vertice_ar_blob_res" || d.url !== u) return;
        clearTimeout(to); window.removeEventListener("message", on);
        res(d.buf ? URL.createObjectURL(new Blob([d.buf], { type: d.mime || "" })) : null);
      }
      window.addEventListener("message", on);
      window.opener.postMessage({ type: "vertice_ar_blob_req", url: u }, location.origin);
    });
    for (const u of blobs) {
      let local = null;
      try { const r = await fetch(u); if (r.ok) local = URL.createObjectURL(await r.blob()); } catch (e) {}
      if (!local) local = await ask(u);
      if (!local) return fail("An asset did not transfer",
        "The studio tab could not hand over one of the uploads. Keep that tab open and press preview again.");
      cfg.scene = cfg.scene.split(u).join(local);
    }
  }

  // A script that fails to PARSE still fires `load`, never `error` — which is exactly how a
  // broken upstream bundle produced a silent black screen. Check the library actually registered.
  const need = cfg.mode === "face" ? "mindar-face" : "mindar-image";
  if (!window.AFRAME) return fail("A-Frame did not initialise",
    "The library loaded but defined nothing. Check the console for a parse error.");
  if (!AFRAME.components[need]) return fail("The AR runtime did not register",
    "<code>" + need + "</code> is missing, so the bundle loaded but failed to execute. "
    + "Check the console for a parse error.");

  // Straight into body: mind-ar takes its container from sceneEl.parentNode, and the video it
  // appends there is position:absolute with z-index:-2, so the container must be the full
  // viewport and must not paint a background over the video.
  const mv = (cfg.libs.find((u) => u.includes("mind-ar@")) || "").split("mind-ar@")[1] || "?";
  document.getElementById("build").textContent =
    cfg.mode + " · mind-ar " + mv.split("/")[0] + " · studio " + (cfg.build || "?") + " · pv " + BUILD;

  document.body.insertAdjacentHTML("beforeend", cfg.scene);
  const sc = document.querySelector("a-scene");
  if (!sc) return fail("Scene did not build", "The generated markup produced no &lt;a-scene&gt;.");

  // The report is the quickest answer to "will this model work?" — matched count and the names
  // that found no target. Without it a mismatched model just sits still and says nothing.
  sc.addEventListener("vertice-morphs-report", (ev) => {
    const d = ev.detail || {};
    const b = document.getElementById("build");
    if (b) b.textContent += "  |  morphs " + d.matched + "/51 matched"
      + (d.meshes ? " · " + d.meshes + " mesh" + (d.meshes > 1 ? "es" : "") : "")
      + (d.missing && d.missing.length ? " · missing " + d.missing.length : "");
    console.log("[vertice] morph report", d);
  });

  // A GLB that cannot be decoded is a common, silent failure — e.g. KTX2-compressed models need
  // loaders A-Frame does not install. Say so rather than showing an empty scene.
  sc.addEventListener("model-error", (ev) => {
    fail("The model did not load",
      "A-Frame could not decode it. Usual causes: a KTX2-compressed or meshopt-packed GLB, which "
      + "needs loaders A-Frame does not install, or a file that is not valid glTF. The studio "
      + "reports both when you pick the file. <code>"
      + ((ev.detail && ev.detail.src) || "").slice(0, 64) + "</code>");
  });

  let done = false;
  const clear = () => { if (!done) { done = true; msg.classList.add("hide"); } };
  sc.addEventListener("arReady", clear);
  sc.addEventListener("renderstart", clear);
  setTimeout(() => {
    if (!done) fail("Still starting",
      "The tracker has not reported ready. The face model is about 2 MB — on slow connections give it a moment, then reload.");
  }, 12000);
  setTimeout(clear, 20000);                         // never leave the overlay stuck over a working scene
})();
</script>
</body>
</html>
